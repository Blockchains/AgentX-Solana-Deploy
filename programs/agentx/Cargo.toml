[package]
name = "agentx"
version = "0.2.1"
description = "AgentX Protocol — on-chain AI agent registry and execution program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agentx"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"

[dev-dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
